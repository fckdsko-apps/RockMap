plugins {
    id 'com.android.application'
}

def versionNameValue = providers.gradleProperty('ROCKMAP_VERSION_NAME').getOrElse('0.1.0-alpha6.6')
def versionCodeValue = (System.getenv('ROCKMAP_VERSION_CODE') ?: '1') as Integer
def repositorySlug = System.getenv('GITHUB_REPOSITORY') ?: ''
// Alpha 6.6 adds a compact APK-bundled search index derived from the same immutable
// Colorado PMTiles basemap RockMap already renders. It deliberately reuses the verified
// immutable Alpha 6.2.1 map/mineral data release and does not add a second map dataset.
def dataReleaseTag = 'rockmap-minerals-alpha6-2-1-20260815-test1'
def manifestUrl = repositorySlug ? "https://github.com/${repositorySlug}/releases/download/${dataReleaseTag}/manifest.json" : ''
def signingDirPath = System.getenv('ROCKMAP_SIGNING_DIR')
def signingProps = new Properties()
def signingReady = false
def generatedOfflineGlyphAssetsDir = layout.buildDirectory.dir('generated/rockmapOfflineGlyphAssets').get().asFile
def generatedOfflinePlaceAssetsDir = layout.buildDirectory.dir('generated/rockmapOfflinePlaceAssets').get().asFile
def offlinePlaceIndexFile = new File(generatedOfflinePlaceAssetsDir, 'rockmap_place_index.tsv.gz')

if (signingDirPath) {
    def signingPropsFile = file("${signingDirPath}/signing.properties")
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
        signingReady = true
    }
}

android {
    namespace 'com.rockmap.app'
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.rockmap.app'
        minSdk 26
        targetSdk 36
        versionCode versionCodeValue
        versionName versionNameValue

        buildConfigField 'String', 'DATA_MANIFEST_URL', '"' + manifestUrl + '"'
        buildConfigField 'int', 'SUPPORTED_MANIFEST_VERSION', '1'
        buildConfigField 'int', 'SUPPORTED_STYLE_SCHEMA_VERSION', '1'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir generatedOfflineGlyphAssetsDir
            assets.srcDir generatedOfflinePlaceAssetsDir
        }
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file("${signingDirPath}/${signingProps['storeFile']}")
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.4.1'

    def roomVersion = '2.8.4'
    implementation "androidx.room:room-runtime:${roomVersion}"
    annotationProcessor "androidx.room:room-compiler:${roomVersion}"

    def workVersion = '2.11.2'
    implementation "androidx.work:work-runtime:${workVersion}"

    testImplementation 'junit:junit:4.13.2'
}

tasks.register('prepareOfflineGlyphs', Exec) {
    description = 'Fetch and verify pinned offline glyph/font assets retained for Alpha 6.6.'
    group = 'build setup'
    inputs.file(rootProject.file('scripts/prepare_offline_glyphs.py'))
    outputs.dir(generatedOfflineGlyphAssetsDir)
    commandLine 'python3', rootProject.file('scripts/prepare_offline_glyphs.py').absolutePath,
            '--output', generatedOfflineGlyphAssetsDir.absolutePath
}

tasks.register('prepareOfflinePlaceIndex', Exec) {
    description = "Derive the Alpha 6.6 offline Find index from RockMap's existing Colorado PMTiles."
    group = 'build setup'
    inputs.files(
            rootProject.file('scripts/prepare_place_index.py'),
            rootProject.file('scripts/build_place_index.py'))
    outputs.file(offlinePlaceIndexFile)
    commandLine 'python3', rootProject.file('scripts/prepare_place_index.py').absolutePath,
            '--output-dir', generatedOfflinePlaceAssetsDir.absolutePath
}

tasks.register('verifyOfflinePlaceIndex') {
    description = 'Fail closed if the generated Alpha 6.6 offline Find index is missing or unreasonable.'
    group = 'verification'
    dependsOn tasks.named('prepareOfflinePlaceIndex')
    doLast {
        if (!offlinePlaceIndexFile.isFile()) {
            throw new GradleException('Missing generated Alpha 6.6 offline basemap search index.')
        }
        long bytes = offlinePlaceIndexFile.length()
        if (bytes < 10_000L || bytes > 12L * 1024L * 1024L) {
            throw new GradleException("Alpha 6.6 offline place index has unsafe/unexpected size: ${bytes} bytes")
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareOfflineGlyphs')
    dependsOn tasks.named('verifyOfflinePlaceIndex')
}
