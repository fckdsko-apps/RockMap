name: Build Colorado Mining Claims Test Pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'scripts/fetch_blm_mining_claims.py'
      - 'scripts/create_claims_test_manifest.py'
      - 'scripts/validate_claims_metadata.py'
      - 'scripts/preflight.py'

permissions:
  contents: write

concurrency:
  group: rockmap-claims-alpha5-test1
  cancel-in-progress: false

jobs:
  build-claims:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add Alpha 5 mining claims test'
    name: Build and publish Alpha 5 Colorado mining-claims test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PMTILES_VERSION: '1.31.2'
      PMTILES_ARCHIVE_SHA256: '3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f'
      TIPPECANOE_VERSION: '2.79.0'
      TIPPECANOE_COMMIT: '68ab8dcc229f95b8b25877697d5e8d66783af503'
      BLM_CLAIMS_URL: 'https://gis.blm.gov/nlsdb/rest/services/HUB/BLM_Natl_MLRS_Mining_Claims_Not_Closed/FeatureServer/0'
      BASELINE_TAG: 'rockmap-land-alpha4-20260814-test1'
      RELEASE_TAG: 'rockmap-claims-alpha5-20260815-test1'
      CLAIMS_NAME: 'colorado-claims-blm-mlrs-not-closed-20260815-alpha5-test1.pmtiles'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate RockMap source before data build
        shell: bash
        run: python3 scripts/preflight.py

      - name: Install pinned Tippecanoe build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ make libsqlite3-dev zlib1g-dev

      - name: Build pinned Tippecanoe
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/tippecanoe"
          git clone --branch "$TIPPECANOE_VERSION" --depth 1 https://github.com/felt/tippecanoe.git "$SRC"
          ACTUAL="$(git -C "$SRC" rev-parse HEAD)"
          if [ "$ACTUAL" != "$TIPPECANOE_COMMIT" ]; then
            echo "::error::Tippecanoe tag resolved to unexpected commit: $ACTUAL"
            exit 1
          fi
          make -C "$SRC" -j2
          test -x "$SRC/tippecanoe"
          "$SRC/tippecanoe" --version
          echo "TIPPECANOE_BIN=$SRC/tippecanoe" >> "$GITHUB_ENV"

      - name: Install pinned PMTiles CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rockmap-pmtiles"
          ARCHIVE="$RUNNER_TEMP/rockmap-pmtiles/pmtiles.tar.gz"
          URL="https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            --output "$ARCHIVE" "$URL"
          printf '%s  %s\n' "$PMTILES_ARCHIVE_SHA256" "$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/rockmap-pmtiles"
          PMTILES_BIN="$(find "$RUNNER_TEMP/rockmap-pmtiles" -type f -name pmtiles | head -n 1)"
          test -n "$PMTILES_BIN"
          chmod +x "$PMTILES_BIN"
          "$PMTILES_BIN" --help >/dev/null
          echo "PMTILES_BIN=$PMTILES_BIN" >> "$GITHUB_ENV"

      - name: Fetch and normalize official BLM MLRS not-closed claims intersecting Colorado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/fetch_blm_mining_claims.py \
            --url "$BLM_CLAIMS_URL" \
            --output dist/claims-normalized.geojson \
            --metadata dist/claims-source-metadata.json
          test -s dist/claims-normalized.geojson
          test -s dist/claims-source-metadata.json

      - name: Build claims vector tiles without dropping polygons
        shell: bash
        env:
          TIPPECANOE_MAX_THREADS: '2'
        run: |
          set -euo pipefail
          "$TIPPECANOE_BIN" \
            -o dist/claims.mbtiles \
            -l claims \
            -Z7 -z14 \
            -pS -pn -pT -pf -pk \
            -y name \
            -y serial \
            -y legacy_serial \
            -y type \
            -y type_code \
            -y disposition \
            -y acres \
            -y quality \
            -y quality_description \
            -y source \
            dist/claims-normalized.geojson
          test -s dist/claims.mbtiles

      - name: Convert and verify claims PMTiles
        shell: bash
        run: |
          set -euo pipefail
          "$PMTILES_BIN" convert dist/claims.mbtiles "dist/$CLAIMS_NAME"
          rm -f dist/claims.mbtiles
          test -s "dist/$CLAIMS_NAME"

          BYTES="$(stat -c '%s' "dist/$CLAIMS_NAME")"
          if [ "$BYTES" -gt 2000000000 ]; then
            echo "::error::Alpha 5 claims PMTiles exceeds RockMap's 2 GB per-file safety limit ($BYTES bytes)."
            exit 1
          fi
          echo "Colorado claims PMTiles bytes: $BYTES"

          "$PMTILES_BIN" verify "dist/$CLAIMS_NAME"
          "$PMTILES_BIN" show "dist/$CLAIMS_NAME" --metadata > dist/claims-pmtiles-metadata.json
          python3 scripts/validate_claims_metadata.py \
            dist/claims-pmtiles-metadata.json \
            dist/claims-source-metadata.json

      - name: Download immutable Alpha 4 baseline manifest
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$BASELINE_TAG/manifest.json"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output dist/baseline-manifest.json "$BASELINE_URL"
          python3 -m json.tool dist/baseline-manifest.json >/dev/null

      - name: Create Alpha 5 claims-test manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create_claims_test_manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --baseline-manifest dist/baseline-manifest.json \
            --claims "dist/$CLAIMS_NAME" \
            --source-metadata dist/claims-source-metadata.json \
            --output dist/manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path("dist/baseline-manifest.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("dist/manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifestVersion"] == 1
          assert manifest["styleSchemaVersion"] == 1
          assert manifest["status"] == "basemap_test"
          files = {item["id"]: item for item in manifest["files"]}
          base_files = {item["id"]: item for item in baseline["files"]}
          assert set(files) == {"style", "base", "land", "claims"}
          assert files["style"] == base_files["style"]
          assert files["base"] == base_files["base"]
          assert files["land"] == base_files["land"]
          assert files["claims"]["required"] is True
          assert len(files["claims"]["sha256"]) == 64
          assert files["claims"]["bytes"] > 0
          print("Alpha 5 manifest reuses exact Alpha 4 style/base/land entries and adds only claims")
          PY

          sha256sum \
            "dist/$CLAIMS_NAME" \
            dist/manifest.json \
            dist/claims-source-metadata.json \
            dist/claims-pmtiles-metadata.json \
            > dist/SHA256SUMS.txt

      - name: Verify repository can host public map assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VISIBILITY="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility')"
          if [ "$VISIBILITY" != "public" ]; then
            echo "::error::RockMap data releases must be public because the Android downloader does not embed GitHub credentials. Repository visibility is: $VISIBILITY"
            exit 1
          fi

      - name: Refuse to overwrite an existing Alpha 5 claims-test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Alpha 5 test data is immutable; do not overwrite it."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Refusing to move an existing data tag."
            exit 1
          fi

      - name: Publish immutable Alpha 5 mining-claims prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/$CLAIMS_NAME" \
            dist/manifest.json \
            dist/claims-source-metadata.json \
            dist/claims-pmtiles-metadata.json \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "RockMap Alpha 5 Colorado mining-claims test" \
            --notes "UNVERIFIED TEST DATA — not for navigation or legal-boundary use. Adds BLM MLRS Mining Claims - Not Closed polygons intersecting Colorado to the already-tested Alpha 4 land-status snapshot. County-only quality-score 25 geometries are excluded as too coarse for a claim-footprint overlay. The source can omit geospatial representations for cases BLM cannot geocode. Absence of a rendered claim is not proof that no claim exists." \
            --prerelease \
            --latest=false

          gh release view "$RELEASE_TAG"
