name: Validate diagnostics Java compile

on:
  push:
    branches:
      - diagnostics-cleanup-2026-09-06

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi

      - name: Inject diagnostics build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inject_tour_debug.py

      - name: Compile generated debug Java
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:compileDebugJavaWithJavac \
            -x prepareOfflinePlaceIndex \
            -x verifyOfflinePlaceIndex
