name: Validate recovered diagnostics

on:
  push:
    branches:
      - diagnostics-cleanup-from-8d7f494

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Ensure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi
          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi

      - name: Compile injectors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/inject_causal_tour_debugger_v2.py \
            scripts/inject_production_diagnostics_noise_policy.py \
            scripts/inject_production_diagnostics_cleanup_v2.py

      - name: Run real injection chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inject_tour_debug.py

      - name: Assert production diagnostics contract survived
        shell: bash
        run: |
          set -euo pipefail
          PANEL=app/src/main/java/com/rockmap/app/DiagnosticsPanel.java
          LOG=app/src/main/java/com/rockmap/app/TourDebugLog.java
          CAUSAL=app/src/main/java/com/rockmap/app/TourDebugCausality.java

          grep -Fq 'Diagnostics: on — tap to turn off' "$PANEL"
          grep -Fq 'Diagnostics: off — tap to enable' "$PANEL"
          grep -Fq 'Export diagnostics' "$PANEL"
          grep -Fq 'Clear diagnostics' "$PANEL"
          grep -Fq 'Intent.ACTION_CREATE_DOCUMENT' "$PANEL"
          grep -Fq 'TourDebugLog.exportTo(activity, data.getData())' "$PANEL"

          grep -Fq 'DIAGNOSTICS_PREFS = "rockmap_diagnostics"' "$LOG"
          grep -Fq 'KEY_ENABLED = "enabled"' "$LOG"
          grep -Fq 'public static void setEnabled(Context context, boolean value)' "$LOG"
          grep -Fq 'public static boolean exportTo(Context context, Uri uri)' "$LOG"
          grep -Fq 'public static boolean clear(Context context)' "$LOG"
          ! grep -Fq 'MediaStore.Downloads' "$LOG"
          ! grep -Fq 'publishMirror' "$LOG"
          ! grep -Fq 'scheduleMirror' "$LOG"
          ! grep -Fq 'RockMap-Tour-Debug.txt' "$LOG"

          grep -Fq 'SCHEMA = "causal-v6-prod"' "$CAUSAL"
          grep -Fq 'pendingTourCallbacks' "$CAUSAL"
          grep -Fq 'recentSameActivityUserCause(activity, 350L)' "$CAUSAL"
          grep -Fq '3500L, TimeUnit.MILLISECONDS' "$CAUSAL"
          grep -Fq '"WARNING", "STEP_NO_PROGRESS"' "$CAUSAL"

          echo 'Recovered production diagnostics contract assertions passed.'

      - name: Compile generated Android Java
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            :app:compileDebugJavaWithJavac \
            -x prepareOfflinePlaceIndex \
            -x verifyOfflinePlaceIndex
