name: Build Tour Debug APK

on:
  push:
    branches:
      - tour-debug
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rockmap-tour-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated tour-debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Ensure Android SDK 37.0 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"

          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

          if [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            "$SDKMANAGER" --install "build-tools;36.0.0"
          fi

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

          echo "ANDROID_HOME=$ANDROID_HOME"
          gradle --version

      - name: Validate RockMap source
        shell: bash
        run: python3 scripts/preflight.py

      - name: Stage verified place index from stable APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          STABLE_ARTIFACT_ID="9622432150"
          EXPECTED_APK_SHA256="d0924dc46fb6f0f1f2376f2ee15a33fa8adff1cad9dab7dc16ff2d7aec035ec0"
          EXPECTED_TSV_SHA256="5a5c5c79c6b012dc47d63ccdf5b1e18b362ada6654492b69872bb64fb24918e1"
          EXPECTED_RECORDS="25790"

          STABLE_APK="$RUNNER_TEMP/rockmap-stable.apk"
          TSV="$RUNNER_TEMP/rockmap_place_index.tsv"
          OUTPUT_DIR="$GITHUB_WORKSPACE/app/build/generated/rockmapOfflinePlaceAssets"
          OUTPUT_GZ="$OUTPUT_DIR/rockmap_place_index.tsv.gz"

          mkdir -p "$OUTPUT_DIR"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STABLE_ARTIFACT_ID}/zip" \
            --output "$STABLE_APK"

          test -s "$STABLE_APK"

          ACTUAL_APK_SHA256="$(sha256sum "$STABLE_APK" | awk '{print $1}')"

          if [ "$ACTUAL_APK_SHA256" != "$EXPECTED_APK_SHA256" ]; then
            echo "::error::Stable APK SHA-256 mismatch"
            echo "Expected: $EXPECTED_APK_SHA256"
            echo "Actual:   $ACTUAL_APK_SHA256"
            exit 1
          fi

          unzip -p "$STABLE_APK" assets/rockmap_place_index.tsv > "$TSV"
          test -s "$TSV"

          ACTUAL_TSV_SHA256="$(sha256sum "$TSV" | awk '{print $1}')"

          if [ "$ACTUAL_TSV_SHA256" != "$EXPECTED_TSV_SHA256" ]; then
            echo "::error::Stable place index SHA-256 mismatch"
            echo "Expected: $EXPECTED_TSV_SHA256"
            echo "Actual:   $ACTUAL_TSV_SHA256"
            exit 1
          fi

          ACTUAL_RECORDS="$(awk 'NF && $1 !~ /^#/ {count++} END {print count+0}' "$TSV")"

          if [ "$ACTUAL_RECORDS" != "$EXPECTED_RECORDS" ]; then
            echo "::error::Stable place index record count mismatch"
            echo "Expected: $EXPECTED_RECORDS"
            echo "Actual:   $ACTUAL_RECORDS"
            exit 1
          fi

          python3 - "$TSV" "$OUTPUT_GZ" <<'PY'
          import gzip
          import pathlib
          import sys

          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])

          dst.parent.mkdir(parents=True, exist_ok=True)

          with src.open("rb") as source, dst.open("wb") as raw:
              with gzip.GzipFile(
                  filename="",
                  mode="wb",
                  fileobj=raw,
                  mtime=0,
                  compresslevel=9
              ) as zipped:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      zipped.write(chunk)
          PY

          test -s "$OUTPUT_GZ"

          echo "Staged verified stable place index:"
          echo "  APK SHA-256: $ACTUAL_APK_SHA256"
          echo "  records: $ACTUAL_RECORDS"
          echo "  TSV SHA-256: $ACTUAL_TSV_SHA256"
          echo "  gzip bytes: $(stat -c%s "$OUTPUT_GZ")"

      - name: Load permanent RockMap signing key
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.ROCKMAP_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_BUNDLE:-}" ]; then
            echo "::error::Missing repository secret ROCKMAP_SIGNING_BUNDLE_B64"
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/rockmap-signing"
          mkdir -p "$SIGNING_DIR"

          printf '%s' "$SIGNING_BUNDLE" \
            | base64 --decode \
            > "$RUNNER_TEMP/rockmap-signing.zip"

          unzip -q "$RUNNER_TEMP/rockmap-signing.zip" -d "$SIGNING_DIR"

          test -f "$SIGNING_DIR/rockmap-release.keystore"
          test -f "$SIGNING_DIR/signing.properties"

          chmod 600 \
            "$SIGNING_DIR/rockmap-release.keystore" \
            "$SIGNING_DIR/signing.properties"

          echo "ROCKMAP_SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"

      - name: Generate Android version code
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CODE=$(( $(date -u +%s) - 1700000000 ))

          if [ "$VERSION_CODE" -le 0 ] || [ "$VERSION_CODE" -ge 2100000000 ]; then
            echo "::error::Generated Android versionCode is outside the safe range"
            exit 1
          fi

          echo "ROCKMAP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Android versionCode: $VERSION_CODE"

      - name: Run debug unit tests without regenerating place index
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            -x prepareOfflinePlaceIndex

      - name: Run release lint without regenerating place index
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :app:lintRelease \
            -x prepareOfflinePlaceIndex

      - name: Build signed release APK without regenerating place index
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleRelease \
            -x prepareOfflinePlaceIndex

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"

          test -x "$APKSIGNER"
          test -x "$APKANALYZER"

          SIGNING_REPORT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNING_REPORT"

          EXPECTED_CERT="$(tr -d '[:space:]' < signing-certificate.sha256 | tr '[:upper:]' '[:lower:]')"

          if ! printf '%s' "$EXPECTED_CERT" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::signing-certificate.sha256 is not a valid 64-character SHA-256 digest"
            exit 1
          fi

          SIGNING_REPORT_LOWER="$(printf '%s\n' "$SIGNING_REPORT" | tr '[:upper:]' '[:lower:]')"

          if ! printf '%s\n' "$SIGNING_REPORT_LOWER" \
            | grep -Fq "certificate sha-256 digest: $EXPECTED_CERT"; then
            echo "::error::APK signing certificate does not match RockMap's permanent certificate"
            exit 1
          fi

          EXPECTED_VERSION="$(sed -n 's/^ROCKMAP_VERSION_NAME=//p' gradle.properties | head -n 1 | tr -d '\r')"

          ACTUAL_APP_ID="$($APKANALYZER manifest application-id "$APK")"
          ACTUAL_VERSION="$($APKANALYZER manifest version-name "$APK")"
          ACTUAL_CODE="$($APKANALYZER manifest version-code "$APK")"
          DEBUGGABLE="$($APKANALYZER manifest debuggable "$APK")"
          MIN_SDK="$($APKANALYZER manifest min-sdk "$APK")"
          TARGET_SDK="$($APKANALYZER manifest target-sdk "$APK")"
          PERMISSIONS="$($APKANALYZER manifest permissions "$APK")"

          [ "$ACTUAL_APP_ID" = "com.rockmap.app" ]
          [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]
          [ "$ACTUAL_CODE" = "$ROCKMAP_VERSION_CODE" ]
          [ "$DEBUGGABLE" = "false" ]
          [ "$MIN_SDK" = "26" ]
          [ "$TARGET_SDK" = "36" ]

          for forbidden in \
            ACCESS_BACKGROUND_LOCATION \
            MANAGE_EXTERNAL_STORAGE \
            READ_EXTERNAL_STORAGE \
            WRITE_EXTERNAL_STORAGE
          do
            if printf '%s\n' "$PERMISSIONS" | grep -q "$forbidden"; then
              echo "::error::Forbidden/unneeded permission found in final APK: $forbidden"
              exit 1
            fi
          done

          unzip -p "$APK" assets/rockmap_place_index.tsv \
            > "$RUNNER_TEMP/final_place_index.tsv"

          test -s "$RUNNER_TEMP/final_place_index.tsv"

          FINAL_PLACE_SHA="$(sha256sum "$RUNNER_TEMP/final_place_index.tsv" | awk '{print $1}')"
          EXPECTED_PLACE_SHA="5a5c5c79c6b012dc47d63ccdf5b1e18b362ada6654492b69872bb64fb24918e1"

          if [ "$FINAL_PLACE_SHA" != "$EXPECTED_PLACE_SHA" ]; then
            echo "::error::Final APK contains the wrong offline place index"
            echo "Expected: $EXPECTED_PLACE_SHA"
            echo "Actual:   $FINAL_PLACE_SHA"
            exit 1
          fi

          echo "Verified final APK place index SHA-256: $FINAL_PLACE_SHA"

          "$APKANALYZER" apk summary "$APK"

      - name: Name tour-debug APK
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^ROCKMAP_VERSION_NAME=//p' gradle.properties | head -n 1 | tr -d '\r')"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"

          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::ROCKMAP_VERSION_NAME contains unsafe filename characters"
            exit 1
          fi

          APK_NAME="RockMap-v${VERSION}-tour-debug-${SHORT_SHA}.apk"

          mkdir -p dist

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "dist/$APK_NAME"

          sha256sum "dist/$APK_NAME" \
            > "dist/$APK_NAME.sha256"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$APK_NAME.sha256" >> "$GITHUB_OUTPUT"

          echo "Built: $APK_NAME"

      - name: Upload tour-debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: dist/${{ steps.package.outputs.apk_name }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.checksum_name }}
          path: dist/${{ steps.package.outputs.checksum_name }}
          archive: false
          retention-days: 30
          if-no-files-found: error
