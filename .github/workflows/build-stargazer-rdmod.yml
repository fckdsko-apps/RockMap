name: Build Stargazer RDMod

on:
  workflow_dispatch:
  push:
    branches:
      - android-file-picker
    paths:
      - ".github/workflows/build-stargazer-rdmod.yml"

permissions:
  contents: read

jobs:
  build-stargazer-arm64:
    name: Build Moffenzeef Stargazer arm64 RDMod
    runs-on: ubuntu-latest

    steps:
      - name: Check out current RackDroid branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Fetch pinned Moffenzeef 2.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          MOFF_SHA="e6a0c67ae446b8879f52e97467a26afa7e5b3f94"
          rm -rf third_party/Moffenzeef /tmp/moffenzeef-src
          mkdir -p /tmp/moffenzeef-src third_party
          curl --fail --location --retry 3 \
            "https://github.com/moffenzeefmodular/VCVrack-submission/archive/${MOFF_SHA}.tar.gz" \
            -o /tmp/moffenzeef.tar.gz
          tar -xzf /tmp/moffenzeef.tar.gz -C /tmp/moffenzeef-src
          mv "/tmp/moffenzeef-src/VCVrack-submission-${MOFF_SHA}" third_party/Moffenzeef
          test -s third_party/Moffenzeef/src/Stargazer.cpp
          test -s third_party/Moffenzeef/res/wavetables/StargazerWavetables.wav
          test -s third_party/Moffenzeef/res/panels/Stargazer.svg
          test -s third_party/Moffenzeef/res/panels/Stargazer-dark.svg

      - name: Prepare isolated Stargazer port in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          moff = root / "third_party" / "Moffenzeef"

          # ------------------------------------------------------------
          # 1. Preserve the canonical Moffenzeef/Stargazer identity while
          #    trimming the package manifest to the one model we are building.
          # ------------------------------------------------------------
          manifest_path = moff / "plugin.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("slug") != "Moffenzeef":
              raise RuntimeError(f"Unexpected upstream plugin slug: {manifest.get('slug')!r}")

          stargazer = next(
              (m for m in manifest.get("modules", []) if m.get("slug") == "Stargazer"),
              None,
          )
          if stargazer is None:
              raise RuntimeError("Pinned upstream manifest does not contain Stargazer")

          keep_top = [
              "slug", "name", "version", "license", "brand", "author",
              "authorEmail", "authorUrl", "pluginUrl", "manualUrl",
              "sourceUrl", "donateUrl", "changelogUrl"
          ]
          trimmed = {k: manifest[k] for k in keep_top if k in manifest}
          trimmed["slug"] = "Moffenzeef"
          trimmed["sourceUrl"] = "https://github.com/moffenzeefmodular/VCVrack-submission"
          trimmed["modules"] = [stargazer]
          manifest_path.write_text(
              json.dumps(trimmed, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # ------------------------------------------------------------
          # 2. Register only Stargazer. Other Moffenzeef translation units
          #    are deliberately not compiled into this RackDroid pack.
          # ------------------------------------------------------------
          (moff / "src" / "plugin.cpp").write_text(
              '#include "plugin.hpp"\n\n'
              'Plugin* pluginInstance;\n\n'
              'void init(Plugin* p) {\n'
              '    pluginInstance = p;\n'
              '    p->addModel(modelStargazer);\n'
              '}\n',
              encoding="utf-8",
          )

          # ------------------------------------------------------------
          # 3. Move Stargazer's 20 ms stereo-spread buffer sizing out of
          #    process(). Rack 2.6.4 dispatches SampleRateChange when a module
          #    is added and whenever the engine rate changes.
          # ------------------------------------------------------------
          source_path = moff / "src" / "Stargazer.cpp"
          src = source_path.read_text(encoding="utf-8")

          state_old = """// --- Simple delay state ---
          std::vector<float> delayBuffer;
          int delayIndex = 0;
          float delayMs = 20.f; // adjustable delay time in milliseconds
          """
          state_new = """// --- Simple delay state ---
          // Pre-sized for RackDroid's validated 48 kHz path so process() can never
          // see an empty buffer before Rack dispatches SampleRateChange.
          std::vector<float> delayBuffer = std::vector<float>(961, 0.f);
          int delayIndex = 0;
          float delayMs = 20.f; // adjustable delay time in milliseconds

          void prepareDelayBuffer(float sr) {
              int delaySamples = std::max(1, (int)std::lround(delayMs * 0.001f * sr));
              delayBuffer.assign(delaySamples + 1, 0.f);
              delayIndex = 0;
          }

          void onSampleRateChange(const SampleRateChangeEvent& e) override {
              prepareDelayBuffer(e.sampleRate);
          }
          """

          # Normalize indentation only for matching; upstream currently has these
          # declarations flush-left within the class.
          if "void prepareDelayBuffer(float sr)" not in src:
              literal_old = state_old.replace("          ", "")
              literal_new = state_new.replace("          ", "")
              if src.count(literal_old) != 1:
                  raise RuntimeError("Could not locate Stargazer delay-state block")
              src = src.replace(literal_old, literal_new, 1)

          process_old = """float delayMs = 20.f;
          int delaySamples = (int)(delayMs * 0.001f * args.sampleRate);
          if ((int)delayBuffer.size() < delaySamples + 1)
              delayBuffer.assign(delaySamples + 1, 0.f);
          """.replace("          ", "")
          process_new = """// Buffer sizing is handled outside the real-time process path.
          int delaySamples = std::max(1, (int)delayBuffer.size() - 1);
          """.replace("          ", "")

          if "Buffer sizing is handled outside the real-time process path." not in src:
              if src.count(process_old) != 1:
                  raise RuntimeError("Could not locate Stargazer process-time delay allocation")
              src = src.replace(process_old, process_new, 1)

          source_path.write_text(src, encoding="utf-8")

          process_pos = src.index("void process(const ProcessArgs& args) override")
          if "delayBuffer.assign" in src[process_pos:]:
              raise RuntimeError("Real-time delay-buffer allocation is still present in process()")

          # ------------------------------------------------------------
          # 4. Add a dedicated shared-library target. This is CI-workspace-only:
          #    no RackDroid host, touch, Oboe, engine, or v09 audio source is edited.
          # ------------------------------------------------------------
          cmake_path = root / "native" / "CMakeLists.txt"
          cmake = cmake_path.read_text(encoding="utf-8")
          cmake_anchor = "\t# Frozen Wasteland (49 modules): code GPLv3, but everything under res/\n"
          cmake_block = """\t# Moffenzeef Stargazer: isolated optional RackDroid plugin.
          \tset(MOFF_DIR ${THIRD_PARTY}/Moffenzeef)
          \tif(NOT EXISTS ${MOFF_DIR}/plugin.json)
          \t\tmessage(FATAL_ERROR "Moffenzeef Stargazer sources not found")
          \tendif()
          \tadd_library(plugin_moffenzeef SHARED
          \t\t${MOFF_DIR}/src/plugin.cpp
          \t\t${MOFF_DIR}/src/Stargazer.cpp)
          \ttarget_link_libraries(plugin_moffenzeef PUBLIC rack_engine)
          \ttarget_compile_features(plugin_moffenzeef PRIVATE cxx_std_17)
          \ttarget_compile_options(plugin_moffenzeef PRIVATE
          \t\t-I${MOFF_DIR}/src -O3 -funsafe-math-optimizations -w)

          """.replace("          ", "")

          if "add_library(plugin_moffenzeef SHARED" not in cmake:
              if cmake.count(cmake_anchor) != 1:
                  raise RuntimeError("Could not find RackDroid CMake insertion anchor")
              cmake = cmake.replace(cmake_anchor, cmake_block + cmake_anchor, 1)
              cmake_path.write_text(cmake, encoding="utf-8")

          # ------------------------------------------------------------
          # 5. Ask Gradle to build plugin_moffenzeef only for this workflow.
          #    Keep it excluded from the APK: the test deliverable is an .rdmod.
          # ------------------------------------------------------------
          gradle_path = root / "app" / "build.gradle.kts"
          gradle = gradle_path.read_text(encoding="utf-8")

          target_old = """\t\t\t\ttargets += if (project.hasProperty("allPlugins"))
          \t\t\t\t\tbaseTargets + optionalTargets
          \t\t\t\telse
          \t\t\t\t\tbaseTargets
          """.replace("          ", "")
          target_new = """\t\t\t\ttargets += when {
          \t\t\t\t\tproject.hasProperty("stargazerPlugin") -> baseTargets + listOf("plugin_moffenzeef")
          \t\t\t\t\tproject.hasProperty("allPlugins") -> baseTargets + optionalTargets
          \t\t\t\t\telse -> baseTargets
          \t\t\t\t}
          """.replace("          ", "")

          if 'project.hasProperty("stargazerPlugin")' not in gradle:
              if gradle.count(target_old) != 1:
                  raise RuntimeError("Could not find RackDroid Gradle target-selection block")
              gradle = gradle.replace(target_old, target_new, 1)

          exclude_anchor = '\t\t\t\t"**/libplugin_ml.so",\n'
          exclude_line = '\t\t\t\t"**/libplugin_moffenzeef.so",\n'
          if exclude_line not in gradle:
              if gradle.count(exclude_anchor) != 1:
                  raise RuntimeError("Could not find RackDroid Gradle JNI exclusion anchor")
              gradle = gradle.replace(exclude_anchor, exclude_anchor + exclude_line, 1)

          gradle_path.write_text(gradle, encoding="utf-8")

          # ------------------------------------------------------------
          # 6. Assertions: identity, source, and v09 audio isolation.
          # ------------------------------------------------------------
          check = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert check["slug"] == "Moffenzeef"
          assert [m["slug"] for m in check["modules"]] == ["Stargazer"]

          required = [
              moff / "src" / "Stargazer.cpp",
              moff / "src" / "plugin.hpp",
              moff / "res" / "panels" / "Stargazer.svg",
              moff / "res" / "panels" / "Stargazer-dark.svg",
              moff / "res" / "wavetables" / "StargazerWavetables.wav",
              moff / "res" / "components",
              moff / "LICENSE",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise RuntimeError("Missing required Stargazer resources: " + ", ".join(missing))

          print("Prepared isolated Moffenzeef/Stargazer CI port.")
          print("RackDroid committed audio/touch/host source remains unchanged.")
          PY

      - name: Build arm64 Stargazer shared library
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleSideloadRelease \
            -PdevKeystore \
            -PtargetAbis=arm64-v8a \
            -PstargazerPlugin \
            --no-daemon

      - name: Package Moffenzeef Stargazer RDMod
        shell: bash
        run: |
          set -euo pipefail

          SO="$(find app/build/intermediates/cxx \
            -type f -path '*/obj/arm64-v8a/libplugin_moffenzeef.so' \
            -print | head -n 1)"
          test -n "${SO}"
          test -s "${SO}"

          STRIP="$(find "${ANDROID_HOME}/ndk" \
            -type f -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip' \
            -print | sort -V | tail -n 1)"
          test -n "${STRIP}"

          OUT="${GITHUB_WORKSPACE}/stargazer-rdmod"
          PACK="${OUT}/pack"
          rm -rf "${OUT}"
          mkdir -p "${PACK}/res/panels" "${PACK}/res/wavetables"

          "${STRIP}" --strip-unneeded -o "${PACK}/libplugin_moffenzeef.so" "${SO}"

          cp third_party/Moffenzeef/plugin.json "${PACK}/plugin.json"
          cp third_party/Moffenzeef/LICENSE "${PACK}/LICENSE"
          cp -R third_party/Moffenzeef/res/components "${PACK}/res/components"
          cp third_party/Moffenzeef/res/panels/Stargazer.svg "${PACK}/res/panels/"
          cp third_party/Moffenzeef/res/panels/Stargazer-dark.svg "${PACK}/res/panels/"
          cp third_party/Moffenzeef/res/wavetables/StargazerWavetables.wav "${PACK}/res/wavetables/"

          (
            cd "${PACK}"
            zip -qr "${OUT}/Moffenzeef-Stargazer-2.6.1-arm64.rdmod" .
          )

          unzip -t "${OUT}/Moffenzeef-Stargazer-2.6.1-arm64.rdmod" >/dev/null

      - name: Validate RDMod contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          import struct

          pack = Path("stargazer-rdmod/Moffenzeef-Stargazer-2.6.1-arm64.rdmod")
          if not pack.is_file() or pack.stat().st_size == 0:
              raise SystemExit("RDMod was not produced")

          with ZipFile(pack) as z:
              names = z.namelist()
              if names.count("plugin.json") != 1:
                  raise SystemExit("RDMod must contain exactly one root plugin.json")

              root_sos = [n for n in names if "/" not in n and n.startswith("libplugin_") and n.endswith(".so")]
              all_sos = [n for n in names if n.endswith(".so")]
              if root_sos != ["libplugin_moffenzeef.so"] or len(all_sos) != 1:
                  raise SystemExit(f"Bad native library layout: {all_sos}")

              manifest = json.loads(z.read("plugin.json"))
              if manifest.get("slug") != "Moffenzeef":
                  raise SystemExit("Wrong plugin slug")
              modules = manifest.get("modules", [])
              if [m.get("slug") for m in modules] != ["Stargazer"]:
                  raise SystemExit("Manifest is not Stargazer-only")

              required = [
                  "res/panels/Stargazer.svg",
                  "res/panels/Stargazer-dark.svg",
                  "res/wavetables/StargazerWavetables.wav",
              ]
              missing = [n for n in required if n not in names]
              if missing:
                  raise SystemExit("Missing required resources: " + ", ".join(missing))

              so = z.read("libplugin_moffenzeef.so")
              if len(so) < 20 or so[:4] != b"\x7fELF":
                  raise SystemExit("Native library is not ELF")
              if so[4] != 2 or so[5] != 1:
                  raise SystemExit("Native library is not 64-bit little-endian ELF")
              machine = struct.unpack_from("<H", so, 18)[0]
              if machine != 183:
                  raise SystemExit(f"Expected ARM64 ELF machine 183, got {machine}")

          print("RDMod validation passed:")
          print("  plugin: Moffenzeef")
          print("  model: Stargazer")
          print("  ABI: arm64-v8a")
          print("  exactly one root native library")
          print("  original Stargazer panels + wavetable present")
          PY

          sha256sum stargazer-rdmod/Moffenzeef-Stargazer-2.6.1-arm64.rdmod \
            | tee stargazer-rdmod/SHA256.txt

          {
            echo "RackDroid branch: ${GITHUB_REF_NAME}"
            echo "RackDroid commit: ${GITHUB_SHA}"
            echo "Moffenzeef upstream commit: e6a0c67ae446b8879f52e97467a26afa7e5b3f94"
            echo "Moffenzeef version: 2.6.1"
            echo "Plugin slug: Moffenzeef"
            echo "Model slug: Stargazer"
            echo "ABI: arm64-v8a"
            echo "RackDroid host/audio/touch sources: not committed or replaced by this workflow"
          } > stargazer-rdmod/BUILD-INFO.txt

      - name: Upload Stargazer RDMod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Moffenzeef-Stargazer-2.6.1-arm64-rdmod
          path: |
            stargazer-rdmod/Moffenzeef-Stargazer-2.6.1-arm64.rdmod
            stargazer-rdmod/SHA256.txt
            stargazer-rdmod/BUILD-INFO.txt
          if-no-files-found: error
